kind: Service
apiVersion: v1
metadata:
  name: nginx-service
  namespace: nginx
spec:
  selector:
    app: nginx
  ports:
    - name: nodeport-80
      port: 80 #This port is used to connect outer world 
      targetPort: 80
      nodePort: 30080 #This port is used where traffic comes to container from outer world
  type: NodePort
